name: Phase2 Integration + Staging

on:
  workflow_dispatch:
  push:
    branches: [ feature/phase2-ci, main ]

jobs:
  integration:
    name: Run Phase2 integration tests
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --colors

      - name: Run integration scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Supabase service role key missing — set SUPABASE_SERVICE_ROLE_KEY in repo secrets.";
            exit 1;
          fi
          node scratch/phase2_integration_test.mjs
          node scratch/phase2_integration_assert.mjs

  # deploy-staging job removed to avoid parse-time secret-expression issues
