name: Phase2 Integration Tests

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  run-phase2-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run Phase2 assertion test
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          node scratch/phase2_integration_assert.mjs > phase2_assert.log 2>&1 || true

      - name: Run Phase2 integration script
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          node scratch/phase2_integration_test.mjs > phase2_test.log 2>&1 || true

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: phase2-logs
          path: |
            phase2_assert.log
            phase2_test.log
