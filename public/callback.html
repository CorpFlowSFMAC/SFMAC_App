<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Autorizando Acceso Corporativo...</title>
    <style>
      body {
        background-color: #111827;
        color: white;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }
      .spinner {
        width: 120px;
        height: 120px;
        border: 3px solid transparent;
        border-top-color: #f97316;
        border-radius: 50%;
        animation: spin 1.5s linear infinite;
        position: relative;
        margin-bottom: 2rem;
      }
      .spinner::after {
        content: "";
        position: absolute;
        inset: 8px;
        border: 3px solid transparent;
        border-top-color: #3b82f6;
        border-bottom-color: #3b82f6;
        border-radius: 50%;
        animation: spin 2s linear infinite reverse;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      h2 {
        font-size: 1.2rem;
        font-weight: 600;
        letter-spacing: 1px;
      }
      #status {
        margin-top: 1rem;
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <h2 id="title">Autorizando sesión de Microsoft...</h2>
    <p id="status">Obteniendo credenciales seguras</p>

    <!-- Cargamos el cliente de Supabase puro en JS versión 2, completamente independiente de Next.js -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      // Extraemos las URLs de ambiente. Como es un archivo estático,
      // usamos la API Supabase self-hosted en Hetzner.

      const supabaseUrl = "http://87.99.137.96:8000";
      const supabaseAnonKey = "";

      const sb = window.supabase.createClient(supabaseUrl, supabaseAnonKey, {
         auth: {
            persistSession: true,
            storage: window.localStorage,
         }
      });

      // El inicializador de Supabase JS verificará el Hash o Search params directamente.
      // Escuchamos el evento apenas suceda.
      sb.auth.onAuthStateChange((event, session) => {
          if (event === 'SIGNED_IN' || event === 'INITIAL_SESSION' || event === 'TOKEN_REFRESHED') {
              if (session && session.user) {
                  document.getElementById("title").innerText = "¡Autenticación Exitosa!";
                  document.getElementById("status").innerText = "Redirigiendo al sistema principal...";

                  // Forzamos el pase a Next.js habiendo ya inyectado el Session en LocalStorage
                  setTimeout(() => {
                      window.location.href = "/dashboard";
                  }, 800);
              }
          }
      });

      // Si después de 5 segundos no pasa nada, puede que no haya hash o haya fallado
      setTimeout(async () => {
         const { data, error } = await sb.auth.getSession();
         if (data && data.session) {
             window.location.href = "/dashboard";
         } else {
             document.getElementById("title").innerText = "Error de Sesión";
             document.getElementById("status").innerText = "No se recibieron credenciales válidas. Serás redirigido.";
             document.getElementById("title").style.color = "#ef4444"; // red

             setTimeout(() => {
                window.location.href = "/login";
             }, 4000);
         }
      }, 5000);

    </script>
  </body>
</html>
